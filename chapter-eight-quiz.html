<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>《第八章》角色测试</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body {
    font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
    background: #14100f;
    color: #e8e0d5;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .wrap {
    width: 100%;
    max-width: 640px;
    background: linear-gradient(180deg, #1e1917, #171311);
    border: 1px solid #3a2f28;
    border-radius: 14px;
    padding: 28px 22px 34px;
    box-shadow: 0 10px 40px rgba(0,0,0,.6);
  }
  h1 {
    font-size: 22px;
    letter-spacing: 2px;
    color: #d9b98a;
    text-align: center;
    margin-bottom: 6px;
  }
  .sub {
    text-align: center;
    font-size: 13px;
    color: #8d7f70;
    margin-bottom: 24px;
    letter-spacing: 1px;
  }
  .progress {
    height: 4px;
    background: #2b231e;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .progress span {
    display: block;
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #a8422f, #d9b98a);
    transition: width .3s;
  }
  .q {
    font-size: 17px;
    line-height: 1.7;
    margin-bottom: 18px;
    color: #f0e7db;
  }
  .opt {
    display: block;
    width: 100%;
    text-align: left;
    background: #241d19;
    border: 1px solid #3a2f28;
    color: #ddd2c4;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.6;
    padding: 13px 16px;
    margin-bottom: 11px;
    border-radius: 9px;
    cursor: pointer;
    transition: .18s;
  }
  .opt:hover {
    background: #332822;
    border-color: #8a6a45;
    transform: translateX(3px);
  }
  .opt:active { transform: scale(.99); }
  .result-title {
    text-align: center;
    font-size: 14px;
    color: #8d7f70;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  .result-name {
    text-align: center;
    font-size: 26px;
    color: #d9b98a;
    letter-spacing: 2px;
    margin-bottom: 18px;
  }
  .result-desc {
    font-size: 14px;
    line-height: 1.9;
    color: #c8bcae;
    background: #1d1815;
    border-left: 3px solid #a8422f;
    padding: 14px 16px;
    border-radius: 0 8px 8px 0;
    margin-bottom: 18px;
  }
  .others {
    font-size: 13px;
    color: #8d7f70;
    line-height: 1.9;
    margin-bottom: 20px;
  }
  .others b { color: #bfae97; font-weight: normal; }
  .again {
    display: block;
    width: 100%;
    padding: 13px;
    background: transparent;
    border: 1px solid #8a6a45;
    color: #d9b98a;
    font-family: inherit;
    font-size: 15px;
    letter-spacing: 2px;
    border-radius: 9px;
    cursor: pointer;
    transition: .2s;
  }
  .again:hover { background: #8a6a45; color: #14100f; }
  .fade { animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>《第八章》角色测试</h1>
  <div class="sub">纳拉提奥大陆 · 你最像谁</div>
  <div class="progress"><span id="bar"></span></div>
  <div id="app"></div>
</div>

<script>
const characters = {
  "伊格纳西娅·伊梅尔达": {F:3,O:0,I:3,R:1,A:3,E:0,M:3,C:1,
    desc:"张扬、浪漫、放荡不羁的革命家。你渴望破坏一切你不认同的事物，禁酒令也好，不公也好，愚蠢的教条也好。你并非完美的慈悲圣人，而是顽劣却正直的普通人。"
  },
  "伊索·赫默斯": {F:2,O:1,I:1,R:3,A:1,E:2,M:1,C:3,
    desc:"机敏圆滑，擅长诡计与骗术，是贫民窟的“魔术师”。你见过太多苦难，所以更懂得怎么活下去。你嘴上不饶人，却总把偷来的面包分给孩子们。"
  },
  "梅尔乔尔·席尔瓦": {F:1,O:2,I:3,R:2,A:2,E:2,M:1,C:2,
    desc:"从石匠之子到国家总统。你幽默亲民，也口才出众，但为了守护新生的国家，你愿意背负残酷。你的一切强硬，都源于你太爱这片土地。"
  },
  "阿尔帕·卢米": {F:0,O:3,I:3,R:0,A:3,E:1,M:2,C:1,
    desc:"“大地的意志”的化身。你背负整个民族的苦难与荣耀，坚信巫师应当重回高贵之位。你自毁，也自律；你残酷，也深情。你是为理想而生的垫脚石。"
  },
  "亚兰汀·多特里纳": {F:3,O:1,I:3,R:0,A:2,E:0,M:2,C:2,
    desc:"最年轻的宫廷炼金术士，天才、傲慢、疯癫而热情。你分割过自己的灵魂，只为追问“灵魂”是什么。你相信无数人的知识加起来，可以模拟全能。"
  },
  "卢克蕾齐娅": {F:2,O:1,I:2,R:2,A:1,E:3,M:3,C:3,
    desc:"剧院的摇钱树，伊格纳西娅的“影子”。你擅长伪装、毒药与陷阱，曾以为自己只是空有皮囊的傀儡，后来却真正成为了有思想的战士。"
  },
  "西蒙·格雷": {F:3,O:0,I:3,R:0,A:3,E:0,M:2,C:1,
    desc:"演说家、社会活动家、通缉犯。你聪明机灵、能言善辩，几乎没有朋友。你享受在人群中制造动静，也享受游荡在危险边缘的感觉。自由比命重要。"
  },
  "碧翠丝·埃里森": {F:2,O:2,I:1,R:3,A:1,E:1,M:1,C:3,
    desc:"利伯提总统，前知名女演员。热情开朗的大明星形象下，是极为了得的政治手腕。你把自由民主和平挂在嘴边，也享受玩弄人心与政治的感觉。"
  },
  "罗萨里奥·蒂亚戈": {F:1,O:2,I:1,R:3,A:2,E:2,M:0,C:3,
    desc:"梅尔乔尔的贴身警卫，曾忠心耿耿。当你认定一个人偏离了道路，你会亲手推翻他，哪怕代价是自己的命。你短小精悍，冷静而决绝。"
  },
  "诺兰·维西奥": {F:3,O:0,I:3,R:0,A:1,E:3,M:2,C:2,
    desc:"伊斯梅尔大陆的发现者。你好奇心极强，至死相信那片大陆存在。你拒不认罪，不是固执，而是你无法背叛自己亲眼所见的东西。"
  },
  "弗兰克林·维西奥": {F:3,O:1,I:3,R:1,A:1,E:3,M:2,C:2,
    desc:"主张奥里戈的神力只是人类能力的延伸。你温和、坚定，被烧死也不改口。你相信神性不在人之外，而在人之中。"
  },
  "安德烈·诺维科夫": {F:1,O:2,I:2,R:1,A:1,E:2,M:3,C:1,
    desc:"贝拉特里亚驯兽术士，搭档是雪橇犬“燧石”。当手足与搭档都死去，你强撑一个月把利奥尔送回加德海姆，然后在庆功宴当晚结束了自己。"
  },
};

const questions = [
  { q:"你更认同哪种说法？", o:[
    ["规则存在，是为了保护人。", {O:3,E:1}],
    ["规则存在，是为了被打破。", {F:3,A:2}],
    ["规则只是工具，看谁在用。", {R:3,C:2}],
  ]},
  { q:"面对不公，你的第一反应是？", o:[
    ["愤怒，并且想立刻做点什么。", {A:3,I:2}],
    ["先观察，找到最有效的办法。", {C:3,R:2}],
    ["忍耐，等一个合适的时机。", {E:3,O:1}],
  ]},
  { q:"你更看重什么？", o:[
    ["理想。哪怕它很远。", {I:3,M:2}],
    ["结果。能实现才有意义。", {R:3,C:2}],
    ["忠诚。对得起自己人。", {E:2,O:2,M:1}],
  ]},
  { q:"别人最可能怎么形容你？", o:[
    ["张扬、有感染力。", {A:2,M:3,F:1}],
    ["聪明、有点难懂。", {C:3,I:1,F:1}],
    ["可靠、能扛事。", {E:3,O:2}],
  ]},
  { q:"如果你拥有力量，你会用来？", o:[
    ["改变世界，哪怕代价很大。", {A:3,I:3}],
    ["保护身边的人。", {E:2,O:2,M:1}],
    ["弄清楚力量的本质。", {I:2,C:3}],
  ]},
  { q:"你更接近哪种孤独？", o:[
    ["没人真正理解我的想法。", {I:2,C:2,F:1}],
    ["我选择了这条路，所以必须独自走。", {E:3,O:1,M:1}],
    ["热闹都是别人的，我只是在场。", {M:2,R:1,E:1}],
  ]},
  { q:"结局和过程，你更在意？", o:[
    ["结局。哪怕过程不体面。", {R:3,C:2}],
    ["过程。我要按自己的方式活。", {F:3,M:2}],
    ["意义。哪怕失败也要留下什么。", {I:3,M:1}],
  ]},
  { q:"如果注定失败，你会？", o:[
    ["仍然去做。失败本身也是一种回答。", {I:3,A:2,M:1}],
    ["换一种方式，活下来再继续。", {R:3,C:2}],
    ["守住自己珍视的东西，别的不管。", {E:3,M:2}],
  ]},
];

const KEYS = ["F","O","I","R","A","E","M","C"];
const app = document.getElementById("app");
const bar = document.getElementById("bar");
let idx = 0;
let score = {};

function start() {
  idx = 0;
  score = {}; KEYS.forEach(k => score[k] = 0);
  render();
}

function render() {
  bar.style.width = (idx / questions.length * 100) + "%";
  const item = questions[idx];
  let html = `<div class="fade"><div class="q">${idx+1}. ${item.q}</div>`;
  item.o.forEach((opt, i) => {
    html += `<button class="opt" onclick="choose(${i})">${"ABC"[i]}. ${opt[0]}</button>`;
  });
  html += `</div>`;
  app.innerHTML = html;
}

function choose(i) {
  const gain = questions[idx].o[i][1];
  for (const k in gain) score[k] += gain[k];
  idx++;
  if (idx < questions.length) {
    render();
  } else {
    bar.style.width = "100%";
    showResult();
  }
}

function showResult() {
  const results = Object.entries(characters).map(([name, v]) => {
    let total = 0;
    KEYS.forEach(k => total += (v[k] || 0) * score[k]);
    return { name, total, desc: v.desc };
  }).sort((a, b) => b.total - a.total);

  const top = results[0];
  const others = results.slice(1, 4);

  let html = `<div class="fade">
    <div class="result-title">你最像</div>
    <div class="result-name">${top.name}</div>
    <div class="result-desc">${top.desc}</div>
    <div class="others">另外接近的角色：<br>${others.map(o => `<b>${o.name}</b>`).join("　")}</div>
    <button class="again" onclick="start()">重新测试</button>
  </div>`;
  app.innerHTML = html;
}

start();
</script>
</body>
</html>
